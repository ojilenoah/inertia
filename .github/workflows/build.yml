# Builds the app in the cloud, so nothing heavy has to be installed locally.
# Every push to main (or a manual run from the Actions tab) makes a new Release on the repository's
# Releases page (right-hand side of the repo's front page) with:
#   - the Windows installer (.exe) and .msi
#   - the Android .apk (arm64, signed automatically, installs directly on a phone) — when that build succeeds
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# needed to create Releases and upload files to them
permissions:
  contents: write

env:
  # one tag per build: v0.1.<build number>
  TAG: v0.1.${{ github.run_number }}

jobs:
  windows:
    # a commit whose message has "[android only]" in it builds just the Android app
    if: ${{ !contains(github.event.head_commit.message, '[android only]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri
      - run: npm ci
      - name: Build desktop installers
        working-directory: apps/app
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: inertia-windows
          path: |
            apps/app/src-tauri/target/release/bundle/nsis/*.exe
            apps/app/src-tauri/target/release/bundle/msi/*.msi
      - name: Publish the Release (download page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Build ${{ github.run_number }}
          make_latest: true
          body: |
            <p align="center">
              <img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/apps/app/src-tauri/icons/128x128.png" width="96" alt="Inertia" />
            </p>

            <h1 align="center">Inertia</h1>
            <p align="center"><b>Motion design &amp; video editing — keyframes, paths, masks, 3D and more.</b></p>

            <p align="center">
              <a href="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/Inertia_0.1.0_x64-setup.exe"><img src="https://img.shields.io/badge/Download%20for%20Windows-.exe%20installer-0078D4?style=for-the-badge&logo=windows11&logoColor=white" alt="Download for Windows" /></a>
              &nbsp;
              <a href="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/Inertia_0.1.0_x64_en-US.msi"><img src="https://img.shields.io/badge/Windows-.msi%20package-5C2D91?style=for-the-badge&logo=windows11&logoColor=white" alt="Windows MSI" /></a>
              &nbsp;
              <a href="#assets"><img src="https://img.shields.io/badge/Android-.apk-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android" /></a>
            </p>

            <p align="center">
              <img src="https://img.shields.io/badge/build-${{ github.run_number }}-111111?style=flat-square" alt="Build ${{ github.run_number }}" />
              <img src="https://img.shields.io/badge/version-0.1.0-E0571A?style=flat-square" alt="Version 0.1.0" />
              <img src="https://img.shields.io/badge/Windows-10%20%7C%2011%20(64--bit)-0078D4?style=flat-square" alt="Windows 10 and 11" />
            </p>

            ---

            ### 💻 Install on Windows
            1. Click **Download for Windows** above.
            2. Open the downloaded `Inertia_0.1.0_x64-setup.exe`.
            3. If Windows shows *"Windows protected your PC"*, click **More info → Run anyway** (the app isn't code-signed yet).
            4. Follow the installer — Inertia opens from the Start menu.

            ### 📱 Android
            The `.apk` is listed under **Assets** below when the Android build succeeds. Download it on your phone and open it (allow installing from your browser if asked).

            <details>
            <summary><b>What's in this build</b></summary>

            - Build **#${{ github.run_number }}**, made from commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - All files are listed under **Assets** below.

            </details>
          files: |
            apps/app/src-tauri/target/release/bundle/nsis/*.exe
            apps/app/src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: false

  android:
    runs-on: ubuntu-latest
    # an Android problem never stops the Windows release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # by default it asks for the old "tools" package, which the current SDK manager no longer has (that
          # made every Android build fail); the platform and build tools Gradle needs come with these instead
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri
      - run: npm ci
      - name: Generate Android project
        working-directory: apps/app
        run: npx tauri android init --ci
      # signed automatically (Android's debug signing, nothing to set up), but the Rust core is built optimised and
      # stripped like the Windows version: that's what keeps the APK small (an unoptimised debug core is ~100 MB)
      # always the same debug key (kept in the repo, like any Android project's debug.keystore): a phone then offers
      # each new build as an update to the installed app instead of refusing it
      - name: Use the project's debug signing key
        run: |
          for d in "$HOME/.android" "${ANDROID_USER_HOME:-}"; do
            [ -n "$d" ] && mkdir -p "$d" && cp apps/app/src-tauri/android-debug.keystore "$d/debug.keystore"
          done
      - name: Build the APK (arm64)
        working-directory: apps/app
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "s"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_STRIP: "true"
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "false"
          CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "false"
          CARGO_PROFILE_DEV_INCREMENTAL: "false"
        run: |
          set -e
          npx tauri android build --apk --debug --target aarch64
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)" "$GITHUB_WORKSPACE/apk-out/Inertia_arm64.apk"
          ls -lh "$GITHUB_WORKSPACE/apk-out"
      - uses: actions/upload-artifact@v4
        with:
          name: inertia-android
          path: apk-out/*.apk
      - name: Add the APK to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Build ${{ github.run_number }}
          files: apk-out/*.apk
          fail_on_unmatched_files: false
