# Builds Moshion in the cloud, so nothing heavy has to be installed locally.
# Every push to main (or a manual run from the Actions tab) produces:
#   - moshion-windows : .exe installer (NSIS) + .msi
#   - moshion-android : debug-signed .apk (installs directly on a phone)
# Download them from the run's "Artifacts" section.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri
      - run: npm ci
      - name: Build desktop installers
        working-directory: apps/app
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: moshion-windows
          path: |
            apps/app/src-tauri/target/release/bundle/nsis/*.exe
            apps/app/src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri
      - run: npm ci
      - name: Generate Android project
        working-directory: apps/app
        run: npx tauri android init --ci
      - name: Build APK (arm64, debug-signed so it installs without a keystore)
        working-directory: apps/app
        run: npx tauri android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: moshion-android
          path: apps/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
